<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chem 101 First Exam Practice</title>
<meta name="description" content="General Chemistry 101 first exam practice: 25 past-exam questions, 60-minute timer, periodic table and full explanations.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232F6F6A'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3E101%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: exam console — sticky header with timer, question navigator rail, one question pane; review mode adds UWorld blocks. */
:root {
  --bg: #F3F6F5; --panel: #FFFFFF; --ink: #1D2B2A; --muted: #5E6E6C; --line: #D5DFDD;
  --accent: #2F6F6A; --accent-soft: #E3EFEC; --ok: #2E7D4F; --ok-soft: #E2F2E8; --bad: #B23A3A; --bad-soft: #F8E3E1;
  --flag: #B9803F; --concept: #EAF1F8; --concept-ink: #2F4F73;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --ar: "IBM Plex Sans Arabic", "Tahoma", sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  --am: #F6D4C9; --ae: #F7E2B8; --tm: #E3E6EB; --pm: #D7E6DF; --md: #D9E8C4; --nm: #CFE3F2; --ha: #F5D0DC; --ng: #DCD7F2; --ln: #F2E3D4; --ac: #EAD9D0;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121A19; --panel: #1A2423; --ink: #E3ECEA; --muted: #9BB0AD; --line: #2E3D3B;
  --accent: #6FC1B7; --accent-soft: #20332F; --ok: #6DCB92; --ok-soft: #1C3226; --bad: #EE8A84; --bad-soft: #3A2120;
  --flag: #E2B26F; --concept: #1E2A38; --concept-ink: #A9C6E8;
  --am: #5A3A31; --ae: #594A2C; --tm: #363C45; --pm: #2E4239; --md: #3A4A2C; --nm: #27405A; --ha: #573042; --ng: #3B3560; --ln: #4D3D2E; --ac: #4A3830; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121A19; --panel: #1A2423; --ink: #E3ECEA; --muted: #9BB0AD; --line: #2E3D3B;
  --accent: #6FC1B7; --accent-soft: #20332F; --ok: #6DCB92; --ok-soft: #1C3226; --bad: #EE8A84; --bad-soft: #3A2120;
  --flag: #E2B26F; --concept: #1E2A38; --concept-ink: #A9C6E8;
  --am: #5A3A31; --ae: #594A2C; --tm: #363C45; --pm: #2E4239; --md: #3A4A2C; --nm: #27405A; --ha: #573042; --ng: #3B3560; --ln: #4D3D2E; --ac: #4A3830; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hbar { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1 }
.brand b { font-size: 16px; letter-spacing: .01em }
.brand span { color: var(--muted); font-size: 12.5px }
@media (max-width: 600px) { .bar { grid-template-columns: 120px minmax(0, 1fr) 44px } .brand { flex: 1 1 100% } .brand b { font-size: 15px } .hbar { gap: 8px } .timer { font-size: 18px; padding: 7px 10px } header button { padding: 7px 11px } }
.ltr { unicode-bidi: isolate; direction: ltr; display: inline-block; max-width: 100%; text-align: left }
.opttxt { text-transform: none; letter-spacing: 0; font-weight: 600 }
.timer { font: 600 22px/1 var(--mono); font-variant-numeric: tabular-nums; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
.timer.low { background: var(--bad-soft); color: var(--bad) }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 8px 14px; }
button:focus-visible, .opt:focus-within { outline: 2px solid var(--accent); outline-offset: 2px }
button.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); font-weight: 600 }
button.danger { color: var(--bad); border-color: var(--bad) }
button:disabled { opacity: .45; cursor: default }
main { max-width: 1180px; margin: 0 auto; padding-block: 18px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 20px }
@media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr) } }
nav { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px) }
@media (max-width: 760px) { nav { position: static } }
nav h3 { margin: 0 0 6px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px }
.cell { padding: 6px 0; text-align: center; font: 600 13px/1 var(--mono); border-radius: 6px; position: relative }
.cell.answered { background: var(--accent-soft); border-color: var(--accent); color: var(--accent) }
.cell.cur { outline: 2px solid var(--ink); outline-offset: 1px }
.cell.flag::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--flag) }
.cell.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok) }
.cell.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad) }
.cell.ptcell { grid-column: span 5; font-family: var(--sans) }
.ptcell .s { display: none }
@media (max-width: 760px) { .grid { grid-template-columns: repeat(9, 1fr) } .cell.ptcell { grid-column: span 2 } .ptcell .s { display: inline } .ptcell .l { display: none } }
.legend { font-size: 12px; color: var(--muted); display: grid; gap: 3px }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px; min-width: 0 }
.qhead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; margin-bottom: 10px }
.qnum { font: 600 13px var(--mono); color: var(--accent); letter-spacing: .04em }
.sec { font-size: 12.5px; color: var(--muted) }
.stem { font-size: 17px; margin: 4px 0 16px; text-wrap: pretty }
.opts { display: grid; gap: 8px }
.opt { position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--panel) }
.opt input { position: absolute; opacity: 0; pointer-events: none }
.opt .let { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font: 600 13px var(--mono) }
.opt.sel { border-color: var(--accent); background: var(--accent-soft) }
.opt.sel .let { background: var(--accent); border-color: var(--accent); color: var(--panel) }
.opt.right { border-color: var(--ok); background: var(--ok-soft) }
.opt.right .let { background: var(--ok); border-color: var(--ok); color: var(--panel) }
.opt.wrongpick { border-color: var(--bad); background: var(--bad-soft) }
.opt.wrongpick .let { background: var(--bad); border-color: var(--bad); color: var(--panel) }
.review .opt { cursor: default }
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; align-items: center }
.controls .sp { flex: 1 }
.flagbtn.on { color: var(--flag); border-color: var(--flag) }
.block { margin-top: 18px; border-radius: 8px; padding: 14px 16px }
.block h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: .07em; text-transform: uppercase }
.concept { background: var(--concept); color: var(--concept-ink) }
.concept ul { margin: 0; padding-left: 18px }
.verdict { font-weight: 600; padding: 10px 14px; border-radius: 8px; margin-top: 16px }
.verdict.ok { background: var(--ok-soft); color: var(--ok) } .verdict.bad { background: var(--bad-soft); color: var(--bad) }
.expl { border: 1px solid var(--line) }
.expl h4 { color: var(--ok) }
.why h4 { color: var(--bad) }
.why { border: 1px solid var(--line) }
.why .row { display: flex; gap: 10px; padding: 6px 0; border-top: 1px dashed var(--line) }
.why .row:first-of-type { border-top: 0 }
.why .tag { flex: none; font: 600 12.5px var(--mono); color: var(--bad); min-width: 64px }
[dir="rtl"] { font-family: var(--ar), var(--sans); text-align: right; line-height: 1.8 }
.rtl-wrap { min-width: 0; flex: 1 }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); margin-top: 12px }
.result { text-align: left }
.score { display: flex; gap: 22px; flex-wrap: wrap; align-items: baseline; margin: 6px 0 14px }
.score .big { font: 600 48px/1 var(--mono); color: var(--accent) }
.bars { display: grid; gap: 8px; margin: 10px 0 18px }
.bar { display: grid; grid-template-columns: 170px minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 13px }
.bar .t { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden }
.bar .t i { display: block; height: 100%; background: var(--accent) }
.bar b { font: 600 13px var(--mono); text-align: right }
.intro p { max-width: 62ch }
.rules { display: grid; gap: 6px; padding-left: 18px; margin: 10px 0 18px }
/* periodic table */
.ptwrap { overflow-x: auto; padding-bottom: 6px }
.pt { display: grid; grid-template-columns: repeat(18, minmax(44px, 1fr)); gap: 3px; min-width: 820px }
.el { border-radius: 4px; padding: 3px 4px 4px; font-size: 10px; line-height: 1.15; color: var(--ink); min-height: 50px }
.el .z { font: 500 9.5px var(--mono); opacity: .8 }
.el .s { font: 700 16px/1.1 var(--sans); display: block }
.el .m { font: 500 9px var(--mono); font-variant-numeric: tabular-nums }
.el .en { display: block; font-size: 8px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.gh { font: 600 10px var(--mono); color: var(--muted); text-align: center; align-self: end; padding-bottom: 2px }
.ph { font: 600 10px var(--mono); color: var(--muted); align-self: center; text-align: center }
.am{background:var(--am)}.ae{background:var(--ae)}.tm{background:var(--tm)}.pm{background:var(--pm)}.md{background:var(--md)}.nm{background:var(--nm)}.ha{background:var(--ha)}.ng{background:var(--ng)}.ln{background:var(--ln)}.ac{background:var(--ac)}
.ptlegend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 10px }
.ptlegend span { display: inline-flex; align-items: center; gap: 5px }
.ptlegend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block }
@media (prefers-reduced-motion: no-preference) { .opt, .cell { transition: background .15s, border-color .15s } }
</style>
</head>
<body>
<header><div class="hbar">
  <div class="brand"><b>General Chemistry 101 · First Exam Practice</b><span>Chapters 1–3 · 25 past-exam questions · 60 minutes</span></div>
  <div class="timer" id="timer" aria-live="off">60:00</div>
  <button id="ptBtn" type="button">Periodic table</button>
  <button id="endBtn" class="danger" type="button">End exam</button>
</div></header>
<main>
  <nav aria-label="Questions"><h3>Questions</h3><div class="grid" id="navgrid"></div>
    <div class="legend" id="legend"></div></nav>
  <section class="pane" id="pane"></section>
</main>
<script>
const D = {"Q":[{"n":1,"ch":1,"sec":"Chapter 1 · Temperature","stem":"A temperature of ______ °C is the same as 198 °F.","opts":["92","142","299","110"],"ans":0,"concept":["°F = (9/5)(°C) + 32        °C = (5/9)(°F − 32)","K = °C + 273.15"],"right":"نستخدم <span dir=\"ltr\" class=\"ltr\">°C = (5/9)(°F − 32) = (5/9)(198 − 32) = (5/9)(166) = 92 °C</span>.","wrong":[[[1],"<span dir=\"ltr\" class=\"ltr\">142</span> لا تطابق القانون؛ يجب طرح <span dir=\"ltr\" class=\"ltr\">32</span> من <span dir=\"ltr\" class=\"ltr\">198</span> أولاً ثم الضرب في <span dir=\"ltr\" class=\"ltr\">5/9</span>."],[[2],"<span dir=\"ltr\" class=\"ltr\">299</span> لا تطابق التحويل الصحيح، والمطلوب درجة الحرارة بالسيلسيوس."],[[3],"<span dir=\"ltr\" class=\"ltr\">110</span> ناتج عن قسمة <span dir=\"ltr\" class=\"ltr\">198</span> على <span dir=\"ltr\" class=\"ltr\">9/5</span> بدون طرح <span dir=\"ltr\" class=\"ltr\">32</span>."]]},{"n":2,"ch":1,"sec":"Chapter 1 · Metric Prefixes","stem":"2.00 mg/L is equivalent to ______ μg/m<sup>3</sup>.","opts":["2.00 × 10<sup>−6</sup>","2.00","2.00 × 10<sup>−3</sup>","2.00 × 10<sup>6</sup>"],"ans":3,"concept":["μ = 10<sup>−6</sup>, m = 10<sup>−3</sup>;  1 L = 10<sup>−3</sup> m<sup>3</sup>","Method 1: number × (old prefix ÷ new prefix)"],"right":"<span dir=\"ltr\" class=\"ltr\">2.00 mg = 2.00 × 10<sup>3</sup> μg</span>، و <span dir=\"ltr\" class=\"ltr\">1 L = 10<sup>−3</sup> m<sup>3</sup></span>. إذن <span dir=\"ltr\" class=\"ltr\">2.00 × 10<sup>3</sup> μg ÷ 10<sup>−3</sup> m<sup>3</sup> = 2.00 × 10<sup>6</sup> μg/m<sup>3</sup></span>.","wrong":[[[0,2],"هذه القيم تنتج عن تحويل خاطئ؛ الميكروغرام أصغر من الملغرام والمتر المكعب أكبر من اللتر، فيجب أن يكبر الرقم."],[[1],"<span dir=\"ltr\" class=\"ltr\">2.00</span> تعني أن الوحدتين متساويتان، لكن الميكروغرام أصغر من الملغرام والمتر المكعب أكبر من اللتر."]]},{"n":3,"ch":1,"sec":"Chapter 1 · Density","stem":"The density of gold metal is 19.3 g/cm<sup>3</sup>. How many liters does 0.633 kg of gold occupy?","opts":["3.28 × 10<sup>−2</sup> L","3.28 × 10<sup>−5</sup> L","12.2 L","12.2 × 10<sup>−3</sup> L"],"ans":0,"concept":["Density is the amount of mass in a unit volume of a substance:  d = m / V","1 cm<sup>3</sup> = 1 mL;  1 L = 1000 mL"],"right":"نحوّل الكتلة إلى غرام: <span dir=\"ltr\" class=\"ltr\">0.633 kg = 633 g</span>. الحجم <span dir=\"ltr\" class=\"ltr\">V = m ÷ d = 633 ÷ 19.3 = 32.8 cm<sup>3</sup> = 32.8 mL = 3.28 × 10<sup>−2</sup> L</span>.","wrong":[[[1],"<span dir=\"ltr\" class=\"ltr\">3.28 × 10<sup>−5</sup> L</span> ناتج عن عدم تحويل <span dir=\"ltr\" class=\"ltr\">kg</span> إلى g."],[[2,3],"<span dir=\"ltr\" class=\"ltr\">12.2</span> ناتج عن ضرب الكتلة في الكثافة أو قسمة الكثافة على الكتلة، والصحيح <span dir=\"ltr\" class=\"ltr\">V = m ÷ d</span>."]]},{"n":4,"ch":1,"sec":"Chapter 1 · Density","stem":"The density of Mg is 1.74 g/cm<sup>3</sup>. What is the mass of a magnesium block that measures 2.5 cm × 3.5 cm × 1.5 cm?","opts":["48 g","23 g","12 g","7.5 g"],"ans":1,"concept":["d = m / V  →  m = d × V","Block: V = length × width × height"],"right":"الحجم = <span dir=\"ltr\" class=\"ltr\">2.5 × 3.5 × 1.5 = 13.1 cm<sup>3</sup></span>، والكتلة = <span dir=\"ltr\" class=\"ltr\">1.74 × 13.1 = 22.8 ≈ 23 g</span> (رقمان معنويان).","wrong":[[[0],"<span dir=\"ltr\" class=\"ltr\">48 g</span> لا تطابق <span dir=\"ltr\" class=\"ltr\">m = d × V</span>."],[[2,3],"<span dir=\"ltr\" class=\"ltr\">7.5 g</span> ناتج عن قسمة الحجم على الكثافة بدل الضرب، و <span dir=\"ltr\" class=\"ltr\">12 g</span> لا تطابق الحساب."]]},{"n":5,"ch":1,"sec":"Chapter 1 · Significant Figures","stem":"Which of the following has the same number of significant figures as the number 1.00310?","opts":["1000000","199.791","8.66","5.119"],"ans":1,"concept":["Zeros between non-zero digits count; trailing zeros count only with a decimal point; leading zeros never count."],"right":"<span dir=\"ltr\" class=\"ltr\">1.00310</span> فيها 6 أرقام معنوية (الأصفار بين الأرقام والصفر الأخير بعد الفاصلة تُعد). <span dir=\"ltr\" class=\"ltr\">199.791</span> فيها أيضاً 6.","wrong":[[[0],"<span dir=\"ltr\" class=\"ltr\">1000000</span> بدون فاصلة عشرية، فالأصفار في النهاية لا تُعد: رقم معنوي واحد."],[[2],"<span dir=\"ltr\" class=\"ltr\">8.66</span> فيها 3 أرقام معنوية."],[[3],"<span dir=\"ltr\" class=\"ltr\">5.119</span> فيها 4 أرقام معنوية."]]},{"n":6,"ch":1,"sec":"Chapter 1 · Significant Figures in Calculations","stem":"The answer of the operation 618 − 1.04 × 9.2 is:","opts":["6.1 × 10<sup>2</sup>","52.2","608.","5.1 × 10<sup>1</sup>"],"ans":2,"concept":["× / ÷: answer has the fewest significant figures.","+ / −: answer has the fewest decimal places."],"right":"نضرب أولاً: <span dir=\"ltr\" class=\"ltr\">1.04 × 9.2 = 9.568</span> ← رقمان معنويان (بسبب <span dir=\"ltr\" class=\"ltr\">9.2) ← 9.6</span>. ثم الطرح: <span dir=\"ltr\" class=\"ltr\">618 − 9.6 = 608.4</span> ← بدون منازل عشرية (لأن <span dir=\"ltr\" class=\"ltr\">618) ← 608</span>.","wrong":[[[0],"<span dir=\"ltr\" class=\"ltr\">6.1 × 10<sup>2</sup></span> فيها رقمان معنويان فقط، لكن قاعدة الطرح تعتمد على المنازل العشرية لا على عدد الأرقام."],[[1,3],"<span dir=\"ltr\" class=\"ltr\">52.2</span> و <span dir=\"ltr\" class=\"ltr\">5.1 × 10<sup>1</sup></span> لا تطابق ترتيب العمليات الصحيح (الضرب قبل الطرح)."]]},{"n":7,"ch":1,"sec":"Chapter 1 · Accuracy and Precision","stem":"If a measurement was precise, but not accurate, it was:","opts":["Repeatable, but not close to the true value","Close to the true value, but not repeatable","Repeatable, and close to the true value","Not repeatable, and not close to the true value"],"ans":0,"concept":["Precision: how close repeated measurements are to each other.","Accuracy: how close a measurement is to the true value."],"right":"الضبط <span dir=\"ltr\" class=\"ltr\">(precise)</span> يعني أن القياسات متكررة وقريبة من بعضها، وعدم الدقة <span dir=\"ltr\" class=\"ltr\">(not accurate)</span> يعني أنها بعيدة عن القيمة الحقيقية.","wrong":[[[1],"قريب من القيمة الحقيقية وغير متكرر = دقيق <span dir=\"ltr\" class=\"ltr\">(accurate)</span> وغير مضبوط، وهو العكس."],[[2],"متكرر وقريب من القيمة الحقيقية = دقيق ومضبوط معاً."],[[3],"لا متكرر ولا قريب = لا دقيق ولا مضبوط."]]},{"n":8,"ch":1,"sec":"Chapter 1 · Dimensional Analysis","stem":"The speed of a satellite shuttle in its orbit is 17500 mile/hr. Convert this speed into m/s. (Hint: 1 mile = 1.6 km)","opts":["245","9022","7778","1345"],"ans":2,"concept":["Multiply by conversion factors written so that each unwanted unit cancels.","1 h = 3600 s"],"right":"<span dir=\"ltr\" class=\"ltr\">17500 mi/h × (1.6 km / 1 mi) × (1000 m / 1 km) × (1 h / 3600 s) = 7778 m/s</span>.","wrong":[[[0,1,3],"هذه القيم تنتج عن نسيان أحد معاملات التحويل أو كتابته مقلوباً؛ يجب تحويل الميل إلى متر والساعة إلى ثانية."]]},{"n":9,"ch":2,"sec":"Chapter 2 · Discovery of Atomic Structure","stem":"In the Rutherford nuclear-atom model, ______.","opts":["the three principal subatomic particles all have essentially the same mass and mass is spread uniformly throughout the atom","the three principal subatomic particles all have essentially the same mass","the light subatomic particles, protons and neutrons, reside in the nucleus","mass is spread essentially uniformly throughout the atom","the heavy subatomic particles, protons and neutrons, reside in the nucleus"],"ans":4,"concept":["Rutherford proposed the nuclear model: almost all the mass and all the positive charge are concentrated in a tiny nucleus, and the electrons occupy the space around it."],"right":"حسب رذرفورد، معظم كتلة الذرة في نواة صغيرة جداً تحتوي البروتونات والنيوترونات، وهما الجسيمات الثقيلة.","wrong":[[[0,1],"الجسيمات الثلاثة ليست متساوية الكتلة: الإلكترون أخف من البروتون بحوالي <span dir=\"ltr\" class=\"ltr\">1836</span> مرة."],[[2],"البروتونات والنيوترونات هي الجسيمات الثقيلة وليست الخفيفة."],[[3],"الكتلة ليست موزعة بانتظام، بل مركّزة في النواة (هذا نموذج طومسون)."]]},{"n":10,"ch":2,"sec":"Chapter 2 · Protons, Neutrons and Electrons","stem":"How many neutrons does an atom of carbon-14 have?","opts":["none","6","7","8","9"],"ans":3,"concept":["Z = number of protons;  A = protons + neutrons;  n = A − Z"],"right":"الكربون <span dir=\"ltr\" class=\"ltr\">Z = 6</span>، و <span dir=\"ltr\" class=\"ltr\">carbon-14</span> تعني <span dir=\"ltr\" class=\"ltr\">A = 14</span>، إذن عدد النيوترونات = <span dir=\"ltr\" class=\"ltr\">14 − 6 = 8</span>.","wrong":[[[0],"كل الذرات غير الهيدروجين<span dir=\"ltr\" class=\"ltr\">-1</span> تحتوي نيوترونات."],[[1],"6 هو عدد البروتونات وليس النيوترونات."],[[2],"7 ناتج عن قسمة العدد الكتلي على 2."],[[4],"9 لا يطابق <span dir=\"ltr\" class=\"ltr\">A − Z</span>."]]},{"n":11,"ch":2,"sec":"Chapter 2 · Protons, Neutrons and Electrons","stem":"Which row in the table below is INCORRECT?<br>(symbol: protons / neutrons / electrons)","opts":["<sup>19</sup>F<sup>−</sup>:  9 / 10 / 10","<sup>23</sup>Na<sup>+</sup>:  11 / 12 / 10","<sup>35</sup>Cl<sup>−</sup>:  17 / 18 / 18","<sup>40</sup>Ca<sup>2+</sup>:  20 / 20 / 18","<sup>137</sup>Ba<sup>2+</sup>:  56 / 137 / 54"],"ans":4,"concept":["n = A − Z;  electrons = Z − charge"],"right":"في <sup><span dir=\"ltr\" class=\"ltr\">137</sup>Ba<sup>2+</sup></span>: البروتونات <span dir=\"ltr\" class=\"ltr\">56</span>، والنيوترونات = <span dir=\"ltr\" class=\"ltr\">137 − 56 = 81</span> وليست <span dir=\"ltr\" class=\"ltr\">137</span>، والإلكترونات <span dir=\"ltr\" class=\"ltr\">54</span>. إذن السطر E خطأ.","wrong":[[[0,1,2,3],"هذه السطور صحيحة: نتحقق من <span dir=\"ltr\" class=\"ltr\">n = A − Z</span> و <span dir=\"ltr\" class=\"ltr\">e = Z</span> − الشحنة لكل منها، مثلاً <sup><span dir=\"ltr\" class=\"ltr\">40</sup>Ca<sup>2+</sup>: 20</span> بروتون، <span dir=\"ltr\" class=\"ltr\">20</span> نيوترون، <span dir=\"ltr\" class=\"ltr\">18</span> إلكترون."]]},{"n":12,"ch":2,"sec":"Chapter 2 · Atomic Weight","stem":"An unknown element is found to have two naturally occurring isotopes with atomic masses of 49.9472 amu (0.25%) and 50.9440 amu (99.75%). Which of the following is the unknown element?","opts":["Fe","Cu","Cr","V","Mn"],"ans":3,"concept":["Atomic weight = Σ [(isotope mass) × (fractional abundance)]"],"right":"نحوّل النسب إلى كسور: <span dir=\"ltr\" class=\"ltr\">0.0025</span> و <span dir=\"ltr\" class=\"ltr\">0.9975</span>. الكتلة الذرية = <span dir=\"ltr\" class=\"ltr\">(0.0025)(49.9472) + (0.9975)(50.9440) = 50.94 amu</span>، وهي كتلة الفاناديوم V.","wrong":[[[0,1,2,4],"كتلها في الجدول الدوري لا تساوي <span dir=\"ltr\" class=\"ltr\">50.94: Fe = 55.85</span>، <span dir=\"ltr\" class=\"ltr\">Cu = 63.55</span>، <span dir=\"ltr\" class=\"ltr\">Cr = 52.00</span>، <span dir=\"ltr\" class=\"ltr\">Mn = 54.94</span>."]]},{"n":13,"ch":2,"sec":"Chapter 2 · The Periodic Table","stem":"Calcium is a ______ and sodium is a ______.","opts":["metalloid, metal","nonmetal, metalloid","metal, metalloid","nonmetal, metal","metal, metal"],"ans":4,"concept":["Metals are on the left side of the periodic table; nonmetals on the upper right; metalloids along the stair-step line."],"right":"<span dir=\"ltr\" class=\"ltr\">Ca</span> في المجموعة <span dir=\"ltr\" class=\"ltr\">2A</span> و <span dir=\"ltr\" class=\"ltr\">Na</span> في <span dir=\"ltr\" class=\"ltr\">1A</span>، وكلاهما في يسار الجدول، إذن كلاهما فلز <span dir=\"ltr\" class=\"ltr\">(metal)</span>.","wrong":[[[0,1,2,3],"أشباه الفلزات هي B و <span dir=\"ltr\" class=\"ltr\">Si</span> و <span dir=\"ltr\" class=\"ltr\">Ge</span> و <span dir=\"ltr\" class=\"ltr\">As</span> و <span dir=\"ltr\" class=\"ltr\">Sb</span> و <span dir=\"ltr\" class=\"ltr\">Te</span> فقط، و <span dir=\"ltr\" class=\"ltr\">Ca</span> و <span dir=\"ltr\" class=\"ltr\">Na</span> ليسا لافلزات."]]},{"n":14,"ch":2,"sec":"Chapter 2 · Ions","stem":"Which of the following pairs is isoelectronic?","opts":["K and Cl","K<sup>+</sup> and Cl","K<sup>+</sup> and Cl<sup>−</sup>","Cl<sup>−</sup> and K"],"ans":2,"concept":["Isoelectronic species have the same number of electrons."],"right":"<span dir=\"ltr\" class=\"ltr\">K<sup>+</sup> = 19 − 1 = 18</span> إلكترون، و <span dir=\"ltr\" class=\"ltr\">Cl<sup>−</sup> = 17 + 1 = 18</span> إلكترون، إذن متشابهان إلكترونياً.","wrong":[[[0],"K فيه <span dir=\"ltr\" class=\"ltr\">19</span> و <span dir=\"ltr\" class=\"ltr\">Cl</span> فيه <span dir=\"ltr\" class=\"ltr\">17</span> إلكترون."],[[1],"<span dir=\"ltr\" class=\"ltr\">K<sup>+</sup></span> فيه <span dir=\"ltr\" class=\"ltr\">18</span> و <span dir=\"ltr\" class=\"ltr\">Cl</span> فيه <span dir=\"ltr\" class=\"ltr\">17</span>."],[[3],"<span dir=\"ltr\" class=\"ltr\">Cl<sup>−</sup></span> فيه <span dir=\"ltr\" class=\"ltr\">18</span> و K فيه <span dir=\"ltr\" class=\"ltr\">19</span>."]]},{"n":15,"ch":2,"sec":"Chapter 2 · Ionic and Molecular Compounds","stem":"Fluorine (F) will form a covalent compound with ______.","opts":["Na","Ca","S","Mg"],"ans":2,"concept":["Ionic compounds: metal + nonmetal.  Molecular (covalent) compounds: nonmetals only."],"right":"المركب التساهمي <span dir=\"ltr\" class=\"ltr\">(covalent)</span> يتكون بين لافلزات، و S لافلز، إذن F يكوّن مع S مركباً تساهمياً.","wrong":[[[0,1,3],"<span dir=\"ltr\" class=\"ltr\">Na</span> و <span dir=\"ltr\" class=\"ltr\">Ca</span> و <span dir=\"ltr\" class=\"ltr\">Mg</span> فلزات، فتكوّن مع F مركبات أيونية."]]},{"n":16,"ch":2,"sec":"Chapter 2 · Writing Ionic Formulas","stem":"The chemical formula of phosphoric acid is H<sub>3</sub>PO<sub>4</sub>. The formula for the compound formed between aluminum ions and phosphate ions is:","opts":["Al<sub>3</sub>(PO<sub>4</sub>)<sub>3</sub>","AlPO<sub>4</sub>","Al(PO<sub>4</sub>)<sub>3</sub>","Al<sub>2</sub>(PO<sub>4</sub>)<sub>3</sub>"],"ans":1,"concept":["The total positive charge must equal the total negative charge (criss-cross, then reduce)."],"right":"من <span dir=\"ltr\" class=\"ltr\">H<sub>3</sub>PO<sub>4</sub></span> نعرف أن الفوسفات <span dir=\"ltr\" class=\"ltr\">PO<sub>4</sub><sup>3−</sup></span>، والألمنيوم <span dir=\"ltr\" class=\"ltr\">Al<sup>3+</sup></span>، والشحنتان <span dir=\"ltr\" class=\"ltr\">+3</span> و <span dir=\"ltr\" class=\"ltr\">−3</span> تتعادلان بنسبة <span dir=\"ltr\" class=\"ltr\">1 : 1</span>، إذن <span dir=\"ltr\" class=\"ltr\">AlPO<sub>4</sub></span>.","wrong":[[[0],"<span dir=\"ltr\" class=\"ltr\">Al<sub>3</sub>(PO<sub>4</sub>)<sub>3</sub></span> غير مبسطة، وتبسيطها <span dir=\"ltr\" class=\"ltr\">AlPO<sub>4</sub></span>."],[[2],"<span dir=\"ltr\" class=\"ltr\">Al(PO<sub>4</sub>)<sub>3</sub>: +3 − 9 = −6</span>، الشحنات لا تتعادل."],[[3],"<span dir=\"ltr\" class=\"ltr\">Al<sub>2</sub>(PO<sub>4</sub>)<sub>3</sub>: +6 − 9 = −3</span>، الشحنات لا تتعادل."]]},{"n":17,"ch":3,"sec":"Chapter 3 · Balancing Equations","stem":"The sequence of the coefficients required to correctly balance the reaction below is:<br>Al(NO<sub>3</sub>)<sub>3</sub> + Na<sub>2</sub>S → Al<sub>2</sub>S<sub>3</sub> + NaNO<sub>3</sub>","opts":["2, 3, 1, 2","2, 3, 1, 6","4, 6, 2, 6","4, 6, 3, 2"],"ans":1,"concept":["Change only the coefficients, never the subscripts; keep polyatomic ions as one unit."],"right":"<span dir=\"ltr\" class=\"ltr\">Al</span>: نضع 2 أمام <span dir=\"ltr\" class=\"ltr\">Al(NO<sub>3</sub>)<sub>3</sub>. S</span>: نضع 3 أمام <span dir=\"ltr\" class=\"ltr\">Na<sub>2</sub>S. Na: 6</span> ذرات فنضع 6 أمام <span dir=\"ltr\" class=\"ltr\">NaNO<sub>3</sub></span>. والنترات 6 في الطرفين: 2، 3، 1، 6.","wrong":[[[0],"2 أمام <span dir=\"ltr\" class=\"ltr\">NaNO<sub>3</sub></span> لا توازن الصوديوم <span dir=\"ltr\" class=\"ltr\">(6</span> في اليسار)."],[[2],"4، 6، 2، 6 لا توازن النترات <span dir=\"ltr\" class=\"ltr\">(12</span> مقابل <span dir=\"ltr\" class=\"ltr\">6)</span>."],[[3],"4، 6، 3، 2 لا توازن <span dir=\"ltr\" class=\"ltr\">Al</span> ولا <span dir=\"ltr\" class=\"ltr\">Na</span>."]]},{"n":18,"ch":3,"sec":"Chapter 3 · Molar Mass","stem":"The molar mass of Mg(ClO<sub>4</sub>)<sub>2</sub>·6H<sub>2</sub>O is:","opts":["132 g/mol","231.8 g/mol","295.8 g/mol","331.3 g/mol"],"ans":3,"concept":["Molar mass = Σ (number of atoms × atomic mass); for a hydrate add n × 18.02."],"right":" const Q = D.Q, PT = D.PT, N = Q.length, LIMIT = 60 * 60, KEY = "chem101-practice-v1";
let st = { mode: "intro", cur: 0, ans: Array(N).fill(null), flag: Array(N).fill(false), left: LIMIT, confirm: false, view: "q" };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.ans && s.ans.length === N) st = Object.assign(st, s, { confirm: false }); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const $ = (id) => document.getElementById(id);
const L = "ABCDE";
const fmtT = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
let tick = null;
function startTimer() { if (tick) return; tick = setInterval(() => { if (st.mode !== "exam") return; st.left = Math.max(0, st.left - 1); drawTimer(); if (st.left % 5 === 0) save(); if (st.left === 0) finish(); }, 1000); }
function drawTimer() { const t = $("timer"); t.textContent = st.mode === "exam" || st.mode === "intro" ? fmtT(st.left) : "Done"; t.classList.toggle("low", st.mode === "exam" && st.left <= 300); }
function score() { return st.ans.reduce((a, v, i) => a + (v === Q[i].ans ? 1 : 0), 0); }

function drawNav() {
  const g = $("navgrid"); g.innerHTML = "";
  Q.forEach((q, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "cell"; b.textContent = q.n;
    if (st.mode === "review") b.classList.add(st.ans[i] === q.ans ? "ok" : "bad");
    else if (st.ans[i] !== null) b.classList.add("answered");
    if (st.flag[i]) b.classList.add("flag");
    if (st.view === "q" && st.cur === i && st.mode !== "intro" && st.mode !== "result") b.classList.add("cur");
    b.onclick = () => { if (st.mode === "intro") return; st.view = "q"; st.cur = i; st.confirm = false; draw(); };
    b.disabled = st.mode === "intro" || st.mode === "result";
    b.setAttribute("aria-label", "Question " + q.n);
    g.appendChild(b);
  });
  const p = document.createElement("button"); p.type = "button"; p.className = "cell ptcell" + (st.view === "pt" ? " cur" : ""); p.innerHTML = '<span class="l">26 · Periodic table</span><span class="s">26 · PT</span>'; p.setAttribute("aria-label", "Item 26, periodic table");
  p.onclick = () => { st.view = "pt"; draw(); }; g.appendChild(p);
  $("legend").innerHTML = st.mode === "review" || st.mode === "result"
    ? '<div><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>Correct</div><div><i style="background:var(--bad-soft);border:1px solid var(--bad)"></i>Wrong or blank</div>'
    : '<div><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>Answered</div><div><i style="background:var(--flag)"></i>Marked for review</div>';
}

function ptHTML() {
  const cells = [];
  for (let g = 1; g <= 18; g++) cells.push('<div class="gh" style="grid-row:1;grid-column:' + g + '">' + g + "<br>" + (g <= 2 ? g + "A" : g >= 13 ? (g - 10) + "A" : g <= 7 ? g + "B" : g <= 10 ? "8B" : (g - 10) + "B") + "</div>");
  PT.forEach((e) => {
    const r = e.row + 1;
    cells.push('<div class="el ' + e.cat + '" style="grid-row:' + r + ';grid-column:' + e.col + '" title="' + e.name + '"><span class="z">' + e.z + '</span><span class="s">' + e.sym + '</span><span class="m">' + e.mass + '</span><span class="en">' + e.name + "</span></div>");
  });
  cells.push('<div class="ph ln" style="grid-row:7;grid-column:3;border-radius:4px">57–71</div><div class="ph ac" style="grid-row:8;grid-column:3;border-radius:4px">89–103</div>');
  cells.push('<div style="grid-row:9;grid-column:1/19;height:8px"></div>');
  const lg = [["am","Alkali metals"],["ae","Alkaline earth metals"],["tm","Transition metals"],["pm","Other metals"],["md","Metalloids"],["nm","Nonmetals"],["ha","Halogens"],["ng","Noble gases"],["ln","Lanthanides"],["ac","Actinides"]];
  return '<div class="qhead"><span class="qnum">ITEM 26 · REFERENCE</span><span class="sec">Use it at any time during the exam</span></div>' +
    '<h2 style="margin:0 0 12px;font-size:20px">Periodic Table of the Elements</h2><div class="ptwrap"><div class="pt">' + cells.join("") + "</div></div>" +
    '<div class="ptlegend">' + lg.map(([c, t]) => '<span><i class="' + c + '"></i>' + t + "</span>").join("") + "</div>" +
    '<p class="sec" style="margin-top:10px">Each box: atomic number · symbol · atomic mass (g/mol). Masses in brackets are for the most stable isotope.</p>' +
    '<div class="controls"><button type="button" id="backQ">Back to question ' + Q[st.cur].n + "</button></div>";
}

function blocks(q, i) {
  const pick = st.ans[i];
  const v = pick === null ? '<div class="verdict bad">Not answered · Correct answer: ' + L[q.ans] + "</div>"
    : pick === q.ans ? '<div class="verdict ok">Correct · ' + L[q.ans] + "</div>" : '<div class="verdict bad">Incorrect · You chose ' + L[pick] + ", correct answer " + L[q.ans] + "</div>";
  return v +
    '<div class="block concept"><h4>Concept review</h4><ul>' + q.concept.map((c) => "<li>" + c + "</li>").join("") + "</ul></div>" +
    '<div class="block expl"><h4>Correct answer: ' + L[q.ans] + ' · <span class="opttxt">' + q.opts[q.ans] + '</span></h4><div dir="rtl">' + q.right + "</div></div>" +
    '<div class="block why"><h4>Why the other choices are wrong</h4>' + q.wrong.map(([ix, t]) => '<div class="row"><span class="tag">' + ix.map((k) => L[k]).join(", ") + '</span><div class="rtl-wrap" dir="rtl">' + t + "</div></div>").join("") + "</div>";
}

function draw() {
  drawNav(); drawTimer();
  const p = $("pane");
  $("endBtn").hidden = st.mode !== "exam";
  if (st.view === "pt") { p.className = "pane"; p.innerHTML = ptHTML(); $("backQ").onclick = () => { st.view = "q"; draw(); }; return; }
  if (st.mode === "intro") {
    p.className = "pane intro";
    p.innerHTML = '<span class="qnum">GENERAL CHEMISTRY 101</span><h2 style="margin:6px 0 4px;font-size:24px;text-wrap:balance">First Exam Practice Test</h2>' +
      '<p class="sec">Chapter 1 Matter and Measurement · Chapter 2 Atoms, Molecules, and Ions · Chapter 3 Stoichiometry</p>' +
      '<ul class="rules"><li><b>25</b> multiple-choice questions taken from past exams.</li><li><b>60 minutes.</b> The exam ends automatically when the timer reaches 00:00.</li>' +
      '<li>Item <b>26</b> is the periodic table. Open it any time from the navigator or the header button.</li><li>Mark a question to come back to it. You can change answers until you end the exam.</li>' +
      '<li>After the exam you get your score and a full explanation of every question.</li></ul>' +
      '<div dir="rtl">25 سؤالاً من أسئلة السنوات السابقة على الشابترات الثلاثة الأولى، والوقت 60 دقيقة. الجدول الدوري هو الفقرة 26 ويمكنك فتحه في أي وقت. بعد إنهاء الامتحان تظهر النتيجة وشرح كل سؤال.</div>' +
      '<div class="controls"><button type="button" class="primary" id="startBtn">Start exam</button></div>';
    $("startBtn").onclick = () => { st.mode = "exam"; st.cur = 0; save(); startTimer(); draw(); };
    return;
  }
  if (st.mode === "result") {
    const s = score(), byCh = [1, 2, 3].map((c) => { const idx = Q.map((q, i) => i).filter((i) => Q[i].ch === c); return [c, idx.filter((i) => st.ans[i] === Q[i].ans).length, idx.length]; });
    const names = { 1: "Ch 1 Measurement", 2: "Ch 2 Atoms & ions", 3: "Ch 3 Stoichiometry" };
    p.className = "pane result";
    p.innerHTML = '<span class="qnum">RESULT</span><div class="score"><span class="big">' + s + " / " + N + '</span><span class="sec">' + Math.round((s / N) * 100) + "% · time used " + fmtT(LIMIT - st.left) + "</span></div>" +
      '<div class="bars">' + byCh.map(([c, a, t]) => '<div class="bar"><span>' + names[c] + '</span><span class="t"><i style="width:' + (a / t) * 100 + '%"></i></span><b>' + a + "/" + t + "</b></div>").join("") + "</div>" +
      '<div class="controls"><button type="button" class="primary" id="revBtn">Review answers</button><span class="sp"></span><button type="button" id="resetBtn">Retake exam</button></div><div id="rc"></div>';
    $("revBtn").onclick = () => { st.mode = "review"; st.cur = 0; save(); draw(); };
    $("resetBtn").onclick = askReset;
    return;
  }
  const i = st.cur, q = Q[i], rev = st.mode === "review";
  p.className = "pane" + (rev ? " review" : "");
  let h = '<div class="qhead"><span class="qnum">QUESTION ' + q.n + " OF " + N + '</span><span class="sec">' + q.sec + "</span></div>";
  h += '<div class="stem">' + q.stem + '</div><div class="opts" role="radiogroup">';
  q.opts.forEach((o, k) => {
    let cls = "opt";
    if (rev) { if (k === q.ans) cls += " right"; else if (st.ans[i] === k) cls += " wrongpick"; }
    else if (st.ans[i] === k) cls += " sel";
    h += '<label class="' + cls + '"><input type="radio" name="o" id="opt' + k + '" value="' + k + '"' + (st.ans[i] === k ? " checked" : "") + (rev ? " disabled" : "") + '><span class="let">' + L[k] + "</span><span>" + o + "</span></label>";
  });
  h += "</div>";
  if (rev) h += blocks(q, i);
  h += '<div class="controls"><button type="button" id="prev"' + (i === 0 ? " disabled" : "") + '>Previous</button><button type="button" id="next"' + (i === N - 1 ? " disabled" : "") + '>Next</button>' +
    (rev ? "" : '<button type="button" class="flagbtn' + (st.flag[i] ? " on" : "") + '" id="flag">' + (st.flag[i] ? "Marked" : "Mark for review") + "</button>") +
    '<span class="sp"></span>' + (rev ? '<button type="button" id="toRes">Back to result</button>' : "") + "</div>";
  if (st.confirm) h += '<div class="confirm" id="cf"></div>';
  p.innerHTML = h;
  if (!rev) q.opts.forEach((o, k) => { $("opt" + k).onchange = () => { st.ans[i] = k; save(); draw(); }; });
  $("prev").onclick = () => go(-1); $("next").onclick = () => go(1);
  if (!rev) $("flag").onclick = () => { st.flag[i] = !st.flag[i]; save(); draw(); };
  if (rev) $("toRes").onclick = () => { st.mode = "result"; draw(); };
  if (st.confirm) drawConfirm();
}
function go(d) { st.cur = Math.min(N - 1, Math.max(0, st.cur + d)); st.view = "q"; st.confirm = false; draw(); }
function drawConfirm() {
  const blank = st.ans.filter((a) => a === null).length;
  $("cf").innerHTML = "<span>End the exam now?" + (blank ? " " + blank + " question" + (blank > 1 ? "s are" : " is") + " unanswered." : "") + '</span><span style="flex:1"></span><button type="button" class="danger" id="cy">End exam</button><button type="button" id="cn">Keep working</button>';
  $("cy").onclick = finish; $("cn").onclick = () => { st.confirm = false; draw(); };
}
function finish() { st.mode = "result"; st.view = "q"; st.confirm = false; save(); draw(); }
let resetArmed = false;
function askReset() {
  const rc = $("rc"); if (!rc) return;
  if (!resetArmed) { resetArmed = true; rc.innerHTML = '<div class="confirm"><span>This clears your answers and restarts the 60-minute timer.</span><span style="flex:1"></span><button type="button" class="danger" id="ry">Retake</button><button type="button" id="rn">Cancel</button></div>';
    $("ry").onclick = () => { resetArmed = false; st = { mode: "intro", cur: 0, ans: Array(N).fill(null), flag: Array(N).fill(false), left: LIMIT, confirm: false, view: "q" }; save(); draw(); };
    $("rn").onclick = () => { resetArmed = false; rc.innerHTML = ""; }; }
}
$("ptBtn").onclick = () => { st.view = st.view === "pt" ? "q" : "pt"; draw(); };
$("endBtn").onclick = () => { st.view = "q"; st.confirm = true; draw(); };
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" && e.key.length === 1 && !/[a-e]/i.test(e.key)) return;
  if (st.view !== "q" || (st.mode !== "exam" && st.mode !== "review")) return;
  const k = e.key.toUpperCase();
  if (st.mode === "exam" && L.includes(k) && k.length === 1 && L.indexOf(k) < Q[st.cur].opts.length) { st.ans[st.cur] = L.indexOf(k); save(); draw(); }
  else if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
});
if (st.mode === "exam") startTimer();
draw();
</script>
</body>
</html>
